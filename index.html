<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoTNestBD Label Generator</title>
    
    <!-- Google Font for clean Bangla & English rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background-color: #efefef;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
        }

        /* --- LABEL DESIGN (50mm x 75mm) --- */
        .label-wrapper {
            background: white;
            width: 50mm;
            height: 75mm;
            padding: 2.5mm;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            display: flex;
            flex-direction: row-reverse; /* Right to Left columns */
            justify-content: space-between;
            overflow: hidden;
            color: #000;
        }

        /* Vertical Text Formatting */
        .vertical-col {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        /* Right Column: Brand & Speed Post */
        .col-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 1.5px solid #000;
            padding-left: 1.5mm;
        }

        .brand-box {
            text-align: left;
            line-height: 1.1;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand-web {
            font-size: 8.5px;
            font-weight: 600;
        }

        .speed-post {
            background-color: #000;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            padding: 8px 3px;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        /* Middle Column: Sender & Recipient */
        .col-details {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0 1.5mm;
            border-left: 1.5px solid #000;
            font-size: 10.5px;
            line-height: 1.3;
        }

        .sender-box, .recipient-box {
            height: 48%;
            overflow: hidden;
        }

        .sec-title {
            font-weight: 700;
            border-left: 1px solid #000;
            padding-left: 2px;
            margin-left: 3px;
            display: inline-block;
        }

        /* Left Column: Footer Info */
        .col-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-right: 0.5mm;
            font-size: 8.5px;
            font-weight: 700;
        }

        /* --- FORM DESIGN --- */
        .form-container {
            width: 100%;
            max-width: 340px;
        }

        .form-container h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #222;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background: #fff;
        }

        .print-btn {
            width: 100%;
            background-color: #635bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 8px;
        }

        .print-btn:hover {
            background-color: #4b44e0;
        }

        /* --- PRINT MEDIA QUERY (For Thermal Printer) --- */
        @media print {
            @page {
                size: 50mm 75mm;
                margin: 0;
            }
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .form-container {
                display: none !important;
            }
            .label-wrapper {
                box-shadow: none;
                margin: 0;
                width: 50mm;
                height: 75mm;
                page-break-after: always;
            }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body>

    <!-- THE LABEL (50x75mm) -->
    <div class="label-wrapper">
        
        <!-- Right Side: Logo & Speed Post -->
        <div class="vertical-col col-header">
            <div class="brand-box">
                <div class="brand-title">IoTNestBD</div>
                <div class="brand-web">www.iotnestbd.com</div>
            </div>
            <div class="speed-post">SPEED POST</div>
        </div>

        <!-- Middle: Sender & Recipient -->
        <div class="vertical-col col-details">
            <div class="sender-box">
                <span class="sec-title">প্রেরক (SENDER)</span>
                <b>IoTNestBD</b><br>
                Lohagara SO,<br>
                Lohagara,Narail<br>
                01638-692919
            </div>

            <div class="recipient-box">
                <span class="sec-title">প্রাপক (RECIPIENT)</span>
                <b id="lbl-name">মোঃ রহিম উদ্দিন</b><br>
                <span id="lbl-address">মিরপুর-১০, ব্লক সি</span><br>
                <span id="lbl-city">ঢাকা - ১২১৬</span><br>
                <span id="lbl-phone">০১৭০০০০০০০০</span>
            </div>
        </div>

        <!-- Left Side: Product & Weight -->
        <div class="vertical-col col-footer">
            <div>Product Category: Electronics Item</div>
            <div>Weight: <span id="lbl-weight">100</span> g</div>
        </div>

    </div>

    <!-- THE FORM -->
    <div class="form-container">
        <h3>প্রাপকের তথ্য এডিট করুন</h3>
        
        <div class="form-group">
            <label>প্রাপকের নাম:</label>
            <input type="text" id="in-name" value="মোঃ রহিম উদ্দিন" oninput="updateLabel()">
        </div>

        <div class="form-group">
            <label>ঠিকানা (এলাকা):</label>
            <input type="text" id="in-address" value="মিরপুর-১০, ব্লক সি" oninput="updateLabel()">
        </div>

        <div class="form-group">
            <label>শহর ও পোস্টকোড:</label>
            <input type="text" id="in-city" value="ঢাকা - ১২১৬" oninput="updateLabel()">
        </div>

        <div class="form-group">
            <label>মোবাইল নম্বর:</label>
            <input type="text" id="in-phone" value="০১৭০০০০০০০০" oninput="updateLabel()">
        </div>

        <div class="form-group">
            <label>ওজন (Weight):</label>
            <input type="number" id="in-weight" value="100" oninput="updateLabel()">
        </div>

        <button class="print-btn" onclick="window.print()">প্রিন্ট করুন (50x75mm)</button>
    </div>

    <!-- JAVASCRIPT FOR LIVE UPDATE -->
    <script>
        function updateLabel() {
            document.getElementById('lbl-name').innerText = document.getElementById('in-name').value;
            document.getElementById('lbl-address').innerText = document.getElementById('in-address').value;
            document.getElementById('lbl-city').innerText = document.getElementById('in-city').value;
            document.getElementById('lbl-phone').innerText = document.getElementById('in-phone').value;
            document.getElementById('lbl-weight').innerText = document.getElementById('in-weight').value;
        }
    </script>

</body>
</html>
