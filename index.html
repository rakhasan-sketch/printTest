<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoTNestBD Label Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #efefef;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 35px 15px;
        }

        /* --- 50mm x 75mm OUTER CONTAINER --- */
        .label-wrapper {
            width: 50mm;
            height: 75mm;
            background: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- 75mm x 50mm HORIZONTAL CANVAS (ROTATED 90 DEG) --- */
        .label-canvas {
            width: 75mm;
            height: 50mm;
            min-width: 75mm;
            min-height: 50mm;
            transform: rotate(90deg);
            padding: 2.5mm 3.5mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #000;
            background: #fff;
        }

        /* Top Row: Brand & Speed Post */
        .row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1.5px solid #000;
            padding-bottom: 1.2mm;
        }

        .brand-title {
            font-size: 17px;
            font-weight: 900;
            letter-spacing: -0.3px;
            line-height: 1;
        }

        .brand-web {
            font-size: 8.5px;
            font-weight: 600;
            margin-top: 2px;
        }

        .speed-post {
            background-color: #000;
            color: #fff;
            font-size: 13.5px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        /* Middle Row: Sender & Recipient */
        .row-details {
            display: flex;
            justify-content: space-between;
            flex-grow: 1;
            padding: 1.5mm 0;
            border-bottom: 1.5px solid #000;
        }

        .col-half {
            width: 48%;
            font-size: 10.5px;
            line-height: 1.28;
        }

        .sec-title {
            font-weight: 800;
            font-size: 10.5px;
            border-bottom: 1px solid #000;
            padding-bottom: 1px;
            margin-bottom: 3px;
            display: block;
        }

        .bold-name {
            font-weight: 800;
            font-size: 11px;
        }

        /* Bottom Row: Category & Weight */
        .row-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1mm;
            font-size: 8.5px;
            font-weight: 800;
        }

        /* --- FORM STYLING --- */
        .form-container {
            width: 100%;
            max-width: 325px;
        }

        .form-container h3 {
            font-size: 15px;
            margin-bottom: 12px;
            color: #222;
            font-weight: 800;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 11.5px;
            font-weight: 700;
            color: #555;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            background: #fff;
            color: #111;
        }

        .print-btn {
            width: 100%;
            background-color: #635bff;
            color: white;
            border: none;
            padding: 11px;
            font-size: 13.5px;
            font-weight: 700;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 6px;
        }

        .print-btn:hover {
            background-color: #4b44e0;
        }

        /* --- PRINT MEDIA QUERY (50x75mm Thermal Printer) --- */
        @media print {
            @page {
                size: 50mm 75mm;
                margin: 0;
            }
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .form-container {
                display: none !important;
            }
            .label-wrapper {
                box-shadow: none;
                margin: 0;
                width: 50mm;
                height: 75mm;
                page-break-after: always;
            }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body>

    <!-- THE LABEL -->
    <div class="label-wrapper">
        <div class="label-canvas">
            
            <!-- Header -->
            <div class="row-header">
                <div>
                    <div class="brand-title">ioTNestBD</div>
                    <div class="brand-web">www.iotnestbd.com</div>
                </div>
                <div class="speed-post">SPEED POST</div>
            </div>

            <!-- Sender & Recipient -->
            <div class="row-details">
                <div class="col-half">
                    <span class="sec-title">প্রেরক (SENDER)</span>
                    <div class="bold-name">ioTNestBD</div>
                    <div>Lohagara SO,</div>
                    <div>Lohagara,Narail</div>
                    <div>01638-692919</div>
                </div>

                <div class="col-half">
                    <span class="sec-title">প্রাপক (RECIPIENT)</span>
                    <div class="bold-name" id="lbl-name">মোঃ রহিম উদ্দিন</div>
                    <div id="lbl-address">মিরপুর-১০, ব্লক সি</div>
                    <div id="lbl-city">ঢাকা - ১২১৬</div>
                    <div id="lbl-phone">০১৭০০০০০০০০</div>
                </div>
            </div>

            <!-- Footer -->
            <div class="row-footer">
                <div>Product Category: Electronics Item</div>
                <div>Weight: <span id="lbl-weight">100</span> g</div>
            </div>

        </div>
    </div>

    <!-- THE FORM -->
    <div class="form-container">
        <h3>প্রাপকের তথ্য এডিট করুন</h3>
        
        <div class="form-group">
            <label>প্রাপকের নাম:</label>
            <input type="text" id="in-name" value="মোঃ রহিম উদ্দিন" oninput="updateLabel()">
        </div>

        <div class="form-group">
            <label>ঠিকানা (এলাকা):</label>
            <input type="text" id="in-address" value="মিরপুর-১০, ব্লক সি" oninput="updateLabel()">
        </div>

        <div class="form-group">
            <label>শহর ও পোস্টকোড:</label>
            <input type="text" id="in-city" value="ঢাকা - ১২১৬" oninput="updateLabel()">
        </div>

        <div class="form-group">
            <label>মোবাইল নম্বর:</label>
            <input type="text" id="in-phone" value="০১৭০০০০০০০০" oninput="updateLabel()">
        </div>

        <div class="form-group">
            <label>ওজন (Weight):</label>
            <input type="number" id="in-weight" value="100" oninput="updateLabel()">
        </div>

        <button class="print-btn" onclick="window.print()">প্রিন্ট করুন (50x75mm)</button>
    </div>

    <!-- LIVE UPDATE SCRIPT -->
    <script>
        function updateLabel() {
            document.getElementById('lbl-name').innerText = document.getElementById('in-name').value;
            document.getElementById('lbl-address').innerText = document.getElementById('in-address').value;
            document.getElementById('lbl-city').innerText = document.getElementById('in-city').value;
            document.getElementById('lbl-phone').innerText = document.getElementById('in-phone').value;
            document.getElementById('lbl-weight').innerText = document.getElementById('in-weight').value;
        }
    </script>

</body>
</html>
